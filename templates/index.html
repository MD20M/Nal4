<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #faf79b 0%, #f0b435 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        input[type="file"] {
            width: 100%;
            padding: 15px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        input[type="file"]:hover {
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #faf79b 0%, #f0b435 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .preview {
            margin-top: 30px;
            text-align: center;
        }
        
        .preview img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #667eea;
        }
        
        .info p {
            color: #555;
            margin: 0;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Meme Generator</h1>
        <p class="subtitle">Ustvari svoj meme z zgornjim in spodnjim tekstom</p>
        
        <div class="info">
            <p><strong>Navodila:</strong> Naloži sliko, dodaj zgornji in spodnji tekst ter klikni "Generiraj Meme"</p>
        </div>
        
        <form id="memeForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="image">Naloži sliko:</label>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>
            
            <div class="form-group">
                <label for="top_text">Zgornji tekst:</label>
                <input type="text" id="top_text" name="top_text" placeholder="Vpiši zgornji tekst...">
            </div>
            
            <div class="form-group">
                <label for="bottom_text">Spodnji tekst:</label>
                <input type="text" id="bottom_text" name="bottom_text" placeholder="Vpiši spodnji tekst...">
            </div>
            
            <button type="submit">Generiraj Meme</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Generiranje mema...</p>
        </div>
        
        <div class="preview" id="preview"></div>
    </div>
    
    <script>
        document.getElementById('memeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const loading = document.getElementById('loading');
            const preview = document.getElementById('preview');
            
            loading.classList.add('active');
            preview.innerHTML = '';
            
            fetch('/generate', {
                method: 'POST',
                body: formData
            })
            .then(response => response.blob())
            .then(blob => {
                const url = URL.createObjectURL(blob);
                preview.innerHTML = `
                    <h3 style="margin-bottom: 15px; color: #333;">Generiran Meme:</h3>
                    <img src="${url}" alt="Generated Meme">
                    <div style="margin-top: 15px;">
                        <a href="${url}" download="meme.jpg" style="display: inline-block; padding: 12px 30px; background: #4CAF50; color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">⬇️ Prenesi Meme</a>
                    </div>
                `;
                loading.classList.remove('active');
            })
            .catch(error => {
                console.error('Napaka:', error);
                preview.innerHTML = '<p style="color: red;">Napaka pri generiranju mema. Prosim, poskusite ponovno.</p>';
                loading.classList.remove('active');
            });
        });
    </script>
</body>
</html>
